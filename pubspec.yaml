name: catrans_app
description: Application de réservation de billets de transport CATRANS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  share_plus: ^13.2.0
  printing: ^5.11.0
  pdf: ^3.10.4
  flutter_svg: ^2.0.9
  smooth_page_indicator: ^1.1.0
  fluttertoast: ^9.1.0
  url_launcher: ^6.2.5
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  mobile_scanner: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/logo.png